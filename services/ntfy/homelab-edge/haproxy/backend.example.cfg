# merge into edge haproxy for https://ntfy.example.com
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/

# --- in frontend fe_https ---
# acl host_ntfy hdr(host) -i ntfy.example.com
# use_backend be_ntfy if host_ntfy

# --- when ntfy runs ON the edge VPS (localhost) ---
backend be_ntfy
    mode http
    option httpchk GET /v1/health
    http-check expect string healthy
    server ntfy 127.0.0.1:2586 check

# --- when ntfy runs AT HOME (replace with lifeboat / app host tailnet IP) ---
# backend be_ntfy
#     mode http
#     option httpchk GET /v1/health
#     http-check expect string healthy
#     server ntfy-home 100.64.0.30:2586 check
