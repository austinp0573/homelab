# deploy to /opt/ntfy/
# copy .env.example to .env, copy config/server.yml.example to config/server.yml, then ./scripts/up.sh

services:
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:v2.14.0}
    container_name: ${CONTAINER_NAME:-ntfy}
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - serve
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-2586}:80"
    volumes:
      - ./config:/etc/ntfy:ro
      - ${DATA_DIR:-./data}:/var/lib/ntfy
      - ${CACHE_DIR:-./cache}:/var/cache/ntfy
    # healthcheck needs wget in the image; v2 images include it
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    init: true
