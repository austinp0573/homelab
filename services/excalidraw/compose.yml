# deploy to /opt/excalidraw/
# copy .env.example to .env, then ./scripts/up.sh
#
# optional basic auth: set ENABLE_BASIC_AUTH=y and create secrets/htpasswd
# (see ./scripts/htpasswd.sh). then point your reverse proxy at AUTH_HOST_PORT.

services:
  excalidraw:
    image: ${EXCALIDRAW_IMAGE:-excalidraw/excalidraw:latest}
    container_name: ${EXCALIDRAW_CONTAINER_NAME:-excalidraw}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${UI_HOST_PORT:-5000}:80"
    environment:
      NODE_ENV: production
      VITE_APP_WS_SERVER_URL: ${VITE_APP_WS_SERVER_URL:-https://collab.private.example.com}
    # published image hardcodes oss-collab.excalidraw.com; rewrite at start
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "patching collab url to $$VITE_APP_WS_SERVER_URL"
        find /usr/share/nginx/html/assets -type f -name '*.js' \
          -exec sed -i "s|https://oss-collab\\.excalidraw\\.com|$$VITE_APP_WS_SERVER_URL|g" {} +
        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  room:
    image: ${ROOM_IMAGE:-excalidraw/excalidraw-room:latest}
    container_name: ${ROOM_CONTAINER_NAME:-excalidraw-room}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ROOM_HOST_PORT:-5001}:80"
    environment:
      PORT: "80"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://draw.private.example.com}

  # optional: ./scripts/up.sh with ENABLE_BASIC_AUTH=y
  auth:
    profiles: ["auth"]
    image: ${AUTH_IMAGE:-nginx:1.27-alpine}
    container_name: ${AUTH_CONTAINER_NAME:-excalidraw-auth}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - excalidraw
    ports:
      - "${HOST_BIND:-127.0.0.1}:${AUTH_HOST_PORT:-5002}:80"
    volumes:
      - ./auth/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
