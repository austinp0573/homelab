# example reverse proxy backends (haproxy-ish). names are placeholders.
# terminate tls on your proxy, then point at the ports from .env.
#
# ui (no basic auth):   127.0.0.1:5000
# ui (with basic auth): 127.0.0.1:5002
# collab / room:        127.0.0.1:5001
#
# collab needs websocket upgrade support on the proxy.
# do not put basic auth on the room port - browsers will hate the ws handshake.
# CORS_ORIGIN on the room container should match the ui public https origin.

# acl host_draw hdr(host) -i draw.private.example.com
# acl host_collab hdr(host) -i collab.private.example.com
# use_backend be_excalidraw if host_draw
# use_backend be_excalidraw_room if host_collab

backend be_excalidraw
    mode http
    server excalidraw 127.0.0.1:5000 check

backend be_excalidraw_auth
    mode http
    server excalidraw-auth 127.0.0.1:5002 check

backend be_excalidraw_room
    mode http
    timeout tunnel 1h
    server excalidraw-room 127.0.0.1:5001 check
