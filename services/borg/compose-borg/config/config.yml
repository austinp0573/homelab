  - /mnt/source/home/*/.cargo/registry
  - /mnt/source/home/*/.npm
  - /mnt/source/home/*/.gradle
  - /mnt/source/home/*/node_modules
  - /mnt/source/home/*/.mozilla/firefox/*/cache2
  - /mnt/source/home/*/.config/google-chrome/*/Cache
  - /mnt/source/home/*/.config/BraveSoftware/*/Cache
  - /mnt/source/home/*/.var/app/*/cache
