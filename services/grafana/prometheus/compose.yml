# deploy to /opt/prometheus/
# copy .env.example to .env, then ./scripts/up.sh

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.4.2}
    container_name: ${CONTAINER_NAME:-prometheus}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-./data}:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  node_exporter:
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.9.1}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME:-node-exporter}
    restart: ${RESTART_POLICY:-unless-stopped}
    pid: host
    ports:
      - "${HOST_BIND:-127.0.0.1}:${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
