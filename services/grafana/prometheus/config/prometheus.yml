# scrape configs. keep cardinality small on a homelab box.
# placeholders for other services are commented - uncomment and fix host:port.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - node_exporter:9100

  # examples - leave commented until the target exists and /metrics is reachable
