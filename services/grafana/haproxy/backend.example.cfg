# merge into edge haproxy when exposing grafana
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/
#
# grafana listens on 127.0.0.1:3000 with network_mode: host
# put tinyauth in front before this is on a public name - see notes/tinyauth.md
#
# 1. add grafana.example.com to HAPROXY_DOMAINS / certs
# 2. acl + use_backend in fe_https
# 3. backend below

# acl host_grafana hdr(host) -i grafana.example.com
# use_backend be_grafana if host_grafana

backend be_grafana
    mode http
    option httpchk GET /api/health
    server grafana 127.0.0.1:3000 check
