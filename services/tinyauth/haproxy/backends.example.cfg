# merge into edge haproxy
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/
#
# DNS + certs need:
#   auth.private.example.com
#   status.private.example.com
#   (later) bao-ui.private.example.com truenas.private.example.com

# --- in frontend fe_https ---
# acl host_auth    hdr(host) -i auth.private.example.com
# acl host_status  hdr(host) -i status.private.example.com
# acl host_bao_ui  hdr(host) -i bao-ui.private.example.com
# acl host_truenas hdr(host) -i truenas.private.example.com
# use_backend be_tinyauth if host_auth
# use_backend be_tinyauth_gate if host_status or host_bao_ui or host_truenas

# login UI - straight to tinyauth (no gate)
backend be_tinyauth
    mode http
    option httpchk GET /
    http-check expect status 200-399
    server tinyauth 127.0.0.1:3000 check

# protected UIs - nginx gate does auth_request then proxies to apps
backend be_tinyauth_gate
    mode http
    option httpchk GET /auth-health
    http-check expect status 401
    server gate 127.0.0.1:8088 check
