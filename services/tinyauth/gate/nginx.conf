worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log off;
  server_tokens off;

  # local health for compose/haproxy checks (not public via haproxy host ACLs)
  server {
    listen 80 default_server;
    location = /health {
      return 200 "ok\n";
    }
    location = /auth-health {
      proxy_pass http://tinyauth:3000/api/auth/nginx;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host status.private.example.com;
      proxy_set_header X-Forwarded-Uri /;
    }
    location / {
      return 404;
    }
  }

  # --- gatus status UI ---
  server {
    listen 80;
    server_name status.private.example.com;

    location / {
      auth_request /_tinyauth;
      auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
      error_page 401 403 500 =302 $redirection_url;

      proxy_pass http://gatus:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_tinyauth {
      internal;
      proxy_pass http://tinyauth:3000/api/auth/nginx;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
    }
  }

  # --- openbao UI (placeholder host + upstream) ---
  server {
    listen 80;
    server_name bao-ui.private.example.com;

    location / {
      auth_request /_tinyauth;
      auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
      error_page 401 403 500 =302 $redirection_url;

      # change port/path when the real UI listener is known
      proxy_pass http://host.docker.internal:8200;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_tinyauth {
      internal;
      proxy_pass http://tinyauth:3000/api/auth/nginx;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
    }
  }

  # --- TrueNAS UI (placeholder) ---
  server {
    listen 80;
    server_name truenas.private.example.com;

    location / {
      auth_request /_tinyauth;
      auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
      error_page 401 403 500 =302 $redirection_url;

      # TrueNAS is often HTTPS on the NAS itself; when you wire this for real,
      # either terminate on the NAS and proxy https://nas-ip or use a LAN http UI port.
      proxy_pass http://host.docker.internal:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_tinyauth {
      internal;
      proxy_pass http://tinyauth:3000/api/auth/nginx;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
    }
  }
}
