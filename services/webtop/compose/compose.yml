services:
  webtop:
    image: lscr.io/linuxserver/webtop:amd64-alpine-mate
    container_name: webtop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ./config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "3gb"
    restart: unless-stopped
