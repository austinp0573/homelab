# merge into edge haproxy when exposing nocodb
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/
#
# 1. add nocodb.private.example.com to HAPROXY_DOMAINS / certs
# 2. acl + use_backend in fe_https
# 3. backend below -> nocodb on localhost (compose HOST_BIND=127.0.0.1)

# acl host_nocodb hdr(host) -i nocodb.private.example.com
# use_backend be_nocodb if host_nocodb

backend be_nocodb
    mode http
    option httpchk GET /api/v1/health
    server nocodb 127.0.0.1:8789 check
