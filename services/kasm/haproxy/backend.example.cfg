# merge into edge haproxy when exposing kasm
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/
#
# 1. add desktop.example.com to HAPROXY_DOMAINS / certs
# 2. acl + use_backend in fe_https
# 3. backend below -> kasm on localhost (compose HOST_BIND=127.0.0.1)
#
# this is option A: proxy speaks https to the container and skips verify
# on the snakeoil cert. needs websocket-friendly timeouts.
#
# option B (http to container after require_ssl: false) would look like a
# normal mode http backend to 127.0.0.1:6901 without the ssl keyword.

# acl host_kasm hdr(host) -i desktop.example.com
# use_backend be_kasm if host_kasm

backend be_kasm
    mode http
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    server kasm 127.0.0.1:6901 ssl verify none check
