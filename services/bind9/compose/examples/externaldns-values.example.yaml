provider:
  name: rfc2136
sources: [service, ingress]
domainFilters: [k8s.tusko.org]
policy: upsert-only
registry: txt
txtOwnerId: tusko-local-k8s
txtPrefix: externaldns-
extraArgs:
  - --rfc2136-host=REPLACE_PRIMARY_IPV4
  - --rfc2136-port=5353
  - --rfc2136-zone=k8s.tusko.org
  - --rfc2136-tsig-keyname=externaldns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-axfr
  - --rfc2136-min-ttl=60s
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: externaldns-rfc2136
        key: tsig-secret
