services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-bridge
    hostname: deb1-tailscale-bridge
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=deb1-container
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: unless-stopped
  
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy-ts-proxy
    network_mode: "container:tailscale-bridge"
    depends_on:
      - tailscale
    environment:
      - REMOTE_TARGET_1=${REMOTE_TARGET_1}
      - REMOTE_TARGET_2=${REMOTE_TARGET_2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped


volumes:
  ts-state:
  caddy-data:
  caddy-config:
