# merge into edge haproxy when exposing gatus publicly
# assumes fe_https already binds *:443 ssl crt /etc/haproxy/certs/
#
# 1. add status.example.com to HAPROXY_DOMAINS / certs
# 2. acl + use_backend in fe_https
# 3. backend below -> gatus on localhost (compose HOST_BIND=127.0.0.1)

# acl host_status hdr(host) -i status.example.com
# use_backend be_gatus if host_status

backend be_gatus
    mode http
    option httpchk GET /health
    server gatus 127.0.0.1:8080 check
