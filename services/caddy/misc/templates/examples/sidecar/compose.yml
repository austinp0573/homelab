# caddy sidecar in front of one app on the compose network
# add your app service below (or attach an external network) and fix the Caddyfile upstream

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:alpine}
    container_name: ${CONTAINER_NAME:-caddy}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HOST_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/config
