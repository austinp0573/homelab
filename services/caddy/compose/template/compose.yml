# deploy to /opt/caddy/
# copy .env.example to .env, edit Caddyfile, then ./scripts/up.sh

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:alpine}
    container_name: ${CONTAINER_NAME:-caddy}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HOST_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/config
    # host gateway so reverse_proxy can reach services on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # no privileged, no gpu
