global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy

    # AWS-LC Hardware-Accelerated TLS 1.3 Ciphers
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tlsv12

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

    # need high tunnel timeout for headscale
    timeout tunnel 1h

frontend http_in
#    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/<wildcar_url>.pem alpn h2,http/1.1
    
    # Global HTTPS Enforcer
    http-request redirect scheme https unless { ssl_fc }

    # Client context headers passed to Nginx
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-For %[src]

    # Directly route all traffic to the single backend container
    acl is_headscale hdr(host) -i <url>
    use_backend headscale_backend if is_headscale

backend headscale_backend
    mode http
    
    server headscale_node 127.0.0.1:8080 check proto h2