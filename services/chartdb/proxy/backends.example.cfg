# example reverse proxy backends (haproxy-ish). names are placeholders.
# terminate tls on your proxy, then point at AUTH_HOST_PORT from .env.
#
# ui (direct, no basic auth): 127.0.0.1:8792
# ui (with basic auth):       127.0.0.1:8793
#
# point the public hostname at the auth sidecar. HOST_PORT is still bound
# for local debugging without the password prompt.

# acl host_chartdb hdr(host) -i chartdb.private.example.com
# use_backend be_chartdb if host_chartdb

backend be_chartdb
    mode http
    server chartdb-auth 127.0.0.1:8793 check

# backend be_chartdb_direct
#     mode http
#     server chartdb 127.0.0.1:8792 check
