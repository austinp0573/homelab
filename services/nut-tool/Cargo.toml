[package]
name = "nut-tool"
version = "0.1.0"
edition = "2024"
description = "NUT-driven UPS shutdown and Wake-on-LAN orchestrator"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-ssh2-tokio = "0.13.0"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
