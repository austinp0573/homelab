services:
  nut-tool:
    image: local/nut-tool:latest
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.toml:/etc/nut-tool/config.toml:ro
      - ./id_ed25519:/etc/nut-tool/id_ed25519:ro
      - ./known_hosts:/etc/nut-tool/known_hosts:ro
      - ./state:/var/lib/nut-tool
