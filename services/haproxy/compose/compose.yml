services:
  haproxy:
    image: docker.io/haproxytech/haproxy-alpine:3.4
    container_name: haproxy
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /etc/haproxy:/usr/local/etc/haproxy:ro
      - /etc/haproxy/certs:/etc/haproxy/certs:ro
