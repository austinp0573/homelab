# example haproxy scraps. names are placeholders.
# terminate tls on the edge, point at the sidecar bind from .env.
#
# default sidecar: 127.0.0.1:8080
#
# if you enabled tls on the sidecar instead (unusual), point at TLS_HOST_PORT
# and use mode tcp or ssl verify none - usually just keep tls on haproxy.

# acl host_app hdr(host) -i app.private.example.com
# use_backend be_sidecar_nginx if host_app

backend be_sidecar_nginx
    mode http
    option http-server-close
    server sidecar 127.0.0.1:8080 check

# websocket-ish app behind the same sidecar:
# backend be_sidecar_nginx_ws
#     mode http
#     timeout tunnel 1h
#     server sidecar 127.0.0.1:8080 check
