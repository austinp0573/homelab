# deploy to /opt/llm-rag-ui/
# start llama-cpp first, copy .env.example to .env, then ./scripts/up.sh

services:
  anythingllm:
    image: ${ANYTHINGLLM_IMAGE:-mintplexlabs/anythingllm:1.11.1}
    container_name: ${CONTAINER_NAME:-llm-anythingllm}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3001}:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      SERVER_PORT: "3001"
      LLM_PROVIDER: ${LLM_PROVIDER:-generic-openai}
      GENERIC_OPEN_AI_BASE_PATH: ${GENERIC_OPEN_AI_BASE_PATH:-http://172.17.0.1:8080/v1}
      GENERIC_OPEN_AI_API_KEY: ${GENERIC_OPEN_AI_API_KEY:-local}
      GENERIC_OPEN_AI_MODEL_PREF: ${GENERIC_OPEN_AI_MODEL_PREF:-local-model}
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: ${GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT:-8192}
    volumes:
      - anythingllm-storage:/app/server/storage
      - ${DOCS_DIR:-/opt/llm/rag/docs}:/docs:ro
    networks:
      - llm-backend

volumes:
  anythingllm-storage:

networks:
  llm-backend:
    external: true
    name: ${LLM_NETWORK:-llm-backend}
