apiVersion: v1alpha1
kind: ContainerConfig
name: nginx
image: docker.io/library/nginx:stable-alpine-slim

network:
  mode: host

mounts:
  - tmpfs:
      destination: /var/cache/nginx
      size: 64MiB
  - tmpfs:
      destination: /run
      size: 16MiB

security:
  profile: restricted
  capabilities:
    add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
