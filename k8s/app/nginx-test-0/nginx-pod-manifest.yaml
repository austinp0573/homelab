apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-test
    app: nginx-test
  name: nginx-test
spec:
  containers:
  - image: nginx:stable-alpine
    name: nginx-test
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-test-service
  name: nginx-test-service
spec:
  ports:
  - name: 3320-80
    nodePort: 30000
    port: 3320
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx-test
  type: NodePort
status:
  loadBalancer: {}
